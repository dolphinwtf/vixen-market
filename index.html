<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vixen Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f11;
    --panel: #141416;
    --ink: #ffffff;
    --muted: #a1a1aa;
    --border: #27272a;
    --hover: #1f1f22;
    --accent: #ffffff;
    --green: #22c55e;
    --blue: #3b82f6;
    --red: #ef4444;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100vh;
    width: 100vw;
    overflow: hidden;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    background-image: 
      linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 40px 40px;
    background-position: center center;
  }

  #spotlight {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    pointer-events: none;
    z-index: 0;
    background: radial-gradient(600px circle at var(--x, 50%) var(--y, 50%), rgba(255,255,255,0.03), transparent 40%);
    transition: background 0.1s ease-out;
  }

  .view {
    display: none;
    width: 100%;
    height: 100%;
    position: relative;
    z-index: 1;
  }
  
  .view.active {
    display: flex;
    flex-direction: column;
    animation: fadeIn 0.3s ease-out forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 24px 40px;
    position: absolute;
    top: 0;
    width: 100%;
    z-index: 10;
    pointer-events: none;
  }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(20, 20, 22, 0.5);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    padding: 8px 16px;
    border-radius: 24px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    pointer-events: auto;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    background-color: var(--green);
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
    animation: pulse 2s infinite;
  }

  .status-dot.blue {
    background-color: var(--blue);
    box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
    animation: pulse 2s infinite;
  }

  .status-dot.red {
    background-color: var(--red);
    box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
    animation: none;
  }

  @keyframes pulse {
    0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
    70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
    100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
  }

  .nav-btn {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(20, 20, 22, 0.5);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    color: var(--ink);
    padding: 8px 20px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    transition: all 0.2s ease;
  }
  .nav-btn:hover { 
    background: var(--hover); 
    border-color: #52525b;
    transform: translateY(-1px);
  }
  .nav-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; }

  .container {
    flex: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 40px;
  }

  .subtitle-top {
    text-align: center;
    color: var(--muted);
    font-size: 15px;
    max-width: 650px;
    line-height: 1.6;
    margin-bottom: 60px;
    margin-top: -40px; 
    letter-spacing: 0.01em;
  }

  .hero-grid {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    max-width: 1100px; 
    gap: 80px; 
    margin-bottom: 60px;
  }

  .left-col, .right-col {
    display: flex;
    flex-direction: column;
    gap: 20px;
    width: 320px; 
    flex-shrink: 0;
  }

  .feature-box, .text-box {
    background: linear-gradient(145deg, #18181b, #111113);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }

  .box-header {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    font-weight: 6
