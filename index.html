<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vixen Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f11;
    --panel: #141416;
    --ink: #ffffff;
    --muted: #a1a1aa;
    --border: #27272a;
    --hover: #1f1f22;
    --accent: #ffffff;
    --green: #22c55e;
    --blue: #3b82f6;
    --red: #ef4444;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100vh;
    width: 100vw;
    overflow: hidden;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    background-image: 
      linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 40px 40px;
    background-position: center center;
  }

  #spotlight {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    pointer-events: none;
    z-index: 0;
    background: radial-gradient(600px circle at var(--x, 50%) var(--y, 50%), rgba(255,255,255,0.03), transparent 40%);
    transition: background 0.1s ease-out;
  }

  .view {
    display: none;
    width: 100%;
    height: 100%;
    position: relative;
    z-index: 1;
  }
  
  .view.active {
    display: flex;
    flex-direction: column;
    animation: fadeIn 0.3s ease-out forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 24px 40px;
    position: absolute;
    top: 0;
    width: 100%;
    z-index: 10;
    pointer-events: none;
  }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(20, 20, 22, 0.5);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    padding: 8px 16px;
    border-radius: 24px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    pointer-events: auto;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    background-color: var(--green);
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
    animation: pulse 2s infinite;
  }

  .status-dot.red {
    background-color: var(--red);
    box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
    animation: none;
  }

  @keyframes pulse {
    0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
    70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
    100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
  }

  .nav-btn {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(20, 20, 22, 0.5);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    color: var(--ink);
    padding: 8px 20px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    transition: all 0.2s ease;
  }
  .nav-btn:hover { 
    background: var(--hover); 
    border-color: #52525b;
    transform: translateY(-1px);
  }
  .nav-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; }

  .container {
    flex: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 40px;
  }

  .subtitle-top {
    text-align: center;
    color: var(--muted);
    font-size: 15px;
    max-width: 650px;
    line-height: 1.6;
    margin-bottom: 60px;
    margin-top: -40px; 
    letter-spacing: 0.01em;
  }

  .hero-grid {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    max-width: 1100px; 
    gap: 80px; 
    margin-bottom: 60px;
  }

  .left-col, .right-col {
    display: flex;
    flex-direction: column;
    gap: 20px;
    width: 320px; 
    flex-shrink: 0;
  }

  .feature-box, .text-box {
    background: linear-gradient(145deg, #18181b, #111113);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }

  .box-header {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .box-header svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

  .feature-list { list-style: none; padding: 0; margin: 0; }
  .feature-list li {
    font-size: 14px;
    color: #d4d4d8;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .feature-list li::before { content: "•"; color: #52525b; font-size: 18px; line-height: 0; }

  .text-box p { color: var(--muted); font-size: 14px; line-height: 1.6; }
  .text-box a {
    color: var(--ink);
    text-decoration: none;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 12px;
    font-size: 14px;
    transition: gap 0.2s;
  }
  .text-box a:hover { text-decoration: underline; text-underline-offset: 4px; gap: 10px; }

  .center-col { 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    position: relative;
  }

  .center-col::before {
    content: '';
    position: absolute;
    width: 200px;
    height: 200px;
    background: rgba(255,255,255,0.05);
    filter: blur(80px);
    border-radius: 50%;
    z-index: 0;
    pointer-events: none;
  }

  .brand-logo {
    font-size: 90px;
    font-weight: 300;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink);
    text-align: center;
    padding-left: 0.2em; 
    z-index: 1;
    text-shadow: 0 0 20px rgba(255,255,255,0.1);
  }

  .cta-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: var(--ink);
    color: #000;
    padding: 14px 32px;
    border-radius: 30px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.2s ease;
    margin-bottom: 24px;
    cursor: pointer;
    border: none;
    box-shadow: 0 4px 15px rgba(255,255,255,0.1);
  }
  .cta-btn:hover { 
    transform: translateY(-2px); 
    box-shadow: 0 6px 20px rgba(255,255,255,0.2);
  }
  .cta-btn:active {
    transform: translateY(1px);
  }
  .cta-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; flex-shrink: 0; }

  .bottom-text {
    display: flex;
    gap: 32px;
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 500;
  }
  .bottom-text span { display: flex; align-items: center; gap: 8px; }
  .bottom-text span::before { content: "✓"; font-size: 11px; color: var(--ink); }

  .products-container {
    max-width: 1000px;
    width: 100%;
    margin: 0 auto;
    padding: 100px 40px 60px;
    overflow-y: auto;
    height: 100%;
  }

  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 40px;
  }

  .header-row h1 { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; }

  .back-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--ink);
    padding: 8px 16px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }
  .back-btn:hover { background: var(--hover); border-color: #52525b; }
  .back-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; }

  .products-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
  }

  .product-card {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    display: block;
    aspect-ratio: 1 / 1;
    border: 1px solid var(--border);
    transition: all 0.3s ease;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  }

  .product-card:hover { 
    transform: translateY(-6px); 
    border-color: #52525b;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  
  .product-card img { 
    width: 100%; 
    height: 100%; 
    object-fit: cover; 
    transition: transform 0.3s ease;
  }
  
  .product-card:hover img {
    transform: scale(1.05);
  }

  .product-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 60%);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    padding-bottom: 20px;
    gap: 4px;
  }

  .product-overlay h3 {
    font-size: 16px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #fff;
    text-align: center;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    margin-bottom: 0;
  }

  .game-status-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(20, 20, 22, 0.75);
    backdrop-filter: blur(6px);
    border: 1px solid var(--border);
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--green);
  }

  .game-status-tag.blue-text { color: var(--blue); }
  .game-status-tag.red-text { color: var(--red); }

  .game-status-dot {
    width: 6px;
    height: 6px;
    background-color: var(--green);
    border-radius: 50%;
  }

  .game-status-dot.blue { background-color: var(--blue); }
  .game-status-dot.red { background-color: var(--red); }

  .pricing-container {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    padding: 40px;
  }

  .pricing-card {
    background: linear-gradient(145deg, #18181b, #111113);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 100%;
    max-width: 520px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  }

  .pricing-header {
    padding: 30px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    background: rgba(255,255,255,0.02);
  }

  .pricing-icon {
    width: 48px;
    height: 48px;
    border-radius: 10px;
    object-fit: cover;
    border: 1px solid var(--border);
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }

  .pricing-title-group h2 {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 4px;
    letter-spacing: -0.01em;
  }

  .pricing-title-group p {
    font-size: 13px;
    color: var(--muted);
  }

  .pricing-options {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .price-option {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 10px;
    text-decoration: none;
    color: var(--ink);
    transition: all 0.2s ease;
    cursor: pointer;
  }

  .price-option:hover {
    background: var(--hover);
    border-color: #52525b;
    transform: translateX(4px);
  }

  .price-option .tier-name {
    font-weight: 600;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .price-option .tier-price {
    font-weight: 700;
    font-size: 16px;
    background: rgba(255,255,255,0.1);
    padding: 4px 12px;
    border-radius: 20px;
    color: var(--ink);
    transition: background 0.2s, color 0.2s;
  }

  .price-option:hover .tier-price {
    background: var(--ink);
    color: var(--bg);
  }

  .pricing-footer {
    padding: 20px 30px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: center;
  }

  /* --- Checkout View Styles --- */
  .checkout-wrapper {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 100px 40px 60px;
    overflow-y: auto;
  }

  .checkout-card {
    background: linear-gradient(145deg, #18181b, #111113);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 100%;
    max-width: 520px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    padding: 40px;
    margin: auto;
  }

  .checkout-card h1 {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: -0.02em;
  }

  .checkout-card > p {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 30px;
    line-height: 1.5;
  }

  .payment-grid {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-bottom: 24px;
  }

  .payment-box {
    background: #0d0d10;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
  }

  .payment-title {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 8px;
  }
